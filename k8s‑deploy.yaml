apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
      - name: cicd-demo
        image: 192.168.5.12/cicd-demo/demo:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 0.5
            memory: 256Mi
          requests:
            cpu: 0.1
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-svc
spec:
  type: NodePort
  selector:
    app: cicd-demo
  ports:
  - port: 80
    nodePort: 30080
